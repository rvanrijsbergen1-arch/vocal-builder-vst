# Builds the Windows x64 VST3, the VocalEngine helper, the local model assets and the installer.
# Runs on GitHub-hosted Windows runners (no paid services). Artifacts appear on the run page.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: "8.0.10"
  ORT_VERSION: "1.20.1"
  VOICE_PACKAGE_URL: ${{ secrets.VOICE_PACKAGE_URL }}
  PYTHONUTF8: "1"        # torch's exporter prints emoji; the default Windows console code page can't
  PYTHONIOENCODING: utf-8

permissions:
  contents: read
  issues: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        # Stop on the first failing command, including native programs (a failed test must fail the job).
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to release with the development licence key
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if (Select-String -Path common/PublicKey.h -Pattern "kIsDevelopmentKey = true") {
            Write-Error "common/PublicKey.h still contains the development key. Run tools/licence_admin.py init and paste your own public key."
            exit 1
          }

      - name: Fetch JUCE and ONNX Runtime
        run: |
          git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git external/JUCE
          # Official NuGet package (github.com/microsoft/onnxruntime returns 404 since Nov 2026).
          $v = $env:ORT_VERSION
          $urls = @("https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$v/microsoft.ml.onnxruntime.$v.nupkg",
                    "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$v",
                    "https://globalcdn.nuget.org/packages/microsoft.ml.onnxruntime.$v.nupkg")
          $ok = $false
          foreach ($attempt in 1..3) { foreach ($u in $urls) {
            if (-not $ok) { try { Invoke-WebRequest $u -OutFile ort.zip; $ok = $true; Write-Host "ONNX Runtime from $u" } catch { Write-Host "failed: $u ($($_.Exception.Message))" } }
          }; if (-not $ok) { Start-Sleep 10 } }
          if (-not $ok) { throw "Could not download ONNX Runtime" }
          Expand-Archive ort.zip -DestinationPath ort-nuget
          New-Item -ItemType Directory -Force external/onnxruntime/include, external/onnxruntime/lib | Out-Null
          Copy-Item ort-nuget/build/native/include/* external/onnxruntime/include/
          Copy-Item ort-nuget/runtimes/win-x64/native/* external/onnxruntime/lib/
          Copy-Item (Get-ChildItem ort-nuget -Filter "LICENSE*" | Select-Object -First 1).FullName external/onnxruntime/LICENSE
          Get-ChildItem external/onnxruntime -Recurse -Name

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin, engine and tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build build --config Release --parallel --target VocalBuilder_VST3 VocalEngine vb_licence_tests PluginWorkflowTest *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 40
          if ($code -ne 0) { exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build local model assets (MDX-Net separation, RMVPE/FCPE pitch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime onnxscript torchfcpe==0.0.4 soundfile scipy cryptography scikit-learn transformers faiss-cpu librosa
          New-Item -ItemType Directory -Force dist/models/separation, dist/models/pitch, dist/models/encoders, dist/models/voices | Out-Null
          python tools/models/fetch_mdx_models.py dist/models/separation
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc
          Invoke-WebRequest https://github.com/yxlllc/RMVPE/releases/download/230917/rmvpe.zip -OutFile rmvpe.zip
          Expand-Archive rmvpe.zip -DestinationPath rmvpe
          python tools/models/export_rmvpe.py rvc rmvpe/model.pt dist/models/pitch/rmvpe.onnx
          python tools/models/export_fcpe.py dist/models/pitch/fcpe.onnx
          Remove-Item dist/models/pitch/*.npy
          # ContentVec content encoder (768-dim, layer 12), same weights RVC/Applio v2 voices are trained with.
          New-Item -ItemType Directory -Force contentvec | Out-Null
          Invoke-WebRequest https://huggingface.co/IAHispano/Applio/resolve/main/Resources/embedders/contentvec/config.json -OutFile contentvec/config.json
          Invoke-WebRequest https://huggingface.co/IAHispano/Applio/resolve/main/Resources/embedders/contentvec/pytorch_model.bin -OutFile contentvec/pytorch_model.bin
          python tools/models/export_encoder.py contentvec-768 contentvec - dist/models/encoders/contentvec-768.onnx

      - name: Add licensed voice package (if provided)
        # VOICE_PACKAGE_URL (repository secret): private download URL of a zip with
        # encoders/<encoder>.onnx + voices/<id>/... produced by the training kit. Without it the
        # installer ships without a voice and the plugin clearly reports that no voice is installed.
        if: env.VOICE_PACKAGE_URL != ''
        run: |
          Invoke-WebRequest $env:VOICE_PACKAGE_URL -OutFile voice.zip
          Expand-Archive voice.zip -DestinationPath dist/models -Force

      - name: Stage files
        run: |
          New-Item -ItemType Directory -Force dist/app, dist/vst3, dist/licences | Out-Null
          Copy-Item build/VocalEngine_artefacts/Release/VocalEngine.exe dist/app/
          Copy-Item external/onnxruntime/lib/onnxruntime.dll dist/app/
          Copy-Item -Recurse "build/VocalBuilder_artefacts/Release/VST3/Vocal Builder.vst3" dist/vst3/
          Copy-Item docs/THIRD_PARTY_NOTICES.md, docs/LICENCE_INVENTORY.md dist/licences/
          Copy-Item external/onnxruntime/LICENSE dist/licences/onnxruntime-LICENSE.txt
          Copy-Item third_party/monocypher/LICENCE.md dist/licences/monocypher-LICENCE.md
          Copy-Item external/JUCE/LICENSE.md dist/licences/JUCE-LICENSE.md
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile dist/vc_redist.x64.exe

      - name: Licence crypto tests
        run: |
          $env:VB_LICENSING_HOME = "$PWD/ci-licensing"
          python tools/licence_admin.py init
          python tools/ci/make_licence_vectors.py > vectors.txt
          build/Release/vb_licence_tests.exe vectors.txt

      - name: Licensed end-to-end test on Windows (CI key, test-only voice)
        # Builds a second engine/test binary that trusts a throw-away CI key, activates this runner,
        # then runs the real plugin processor code: import -> extract -> convert -> preview -> export.
        # The "voice" is an UNTRAINED network flagged test_only: it checks plumbing, not quality.
        run: |
          $env:VB_LICENSING_HOME = "$PWD/ci-licensing"
          python tools/ci/write_pubkey_header.py "$PWD/ci_pubkey.h"
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DVB_BUILD_PLUGIN=OFF -DVB_PERSONAL_BUILD=OFF "-DVB_PUBLIC_KEY_HEADER=$PWD/ci_pubkey.h"
          cmake --build build-ci --config Release --parallel --target VocalEngine PluginWorkflowTest
          Copy-Item external/onnxruntime/lib/onnxruntime.dll build-ci/VocalEngine_artefacts/Release/
          Copy-Item external/onnxruntime/lib/onnxruntime.dll build-ci/PluginWorkflowTest_artefacts/Release/
          python tools/ci/ci_activate.py build-ci/VocalEngine_artefacts/Release/VocalEngine.exe
          git clone --depth 1 https://github.com/bshall/hubert.git hubert-src
          Invoke-WebRequest https://github.com/bshall/hubert/releases/download/v0.1/hubert-soft-0d54a1f4.pt -OutFile hubert-soft.pt
          New-Item -ItemType Directory -Force testmodels | Out-Null
          Copy-Item -Recurse dist/models/separation, dist/models/pitch testmodels/
          New-Item -ItemType Directory -Force testmodels/encoders | Out-Null
          python tools/models/export_encoder.py hubert-soft-256 hubert-soft.pt hubert-src testmodels/encoders/hubert-soft-256.onnx
          python tools/models/export_rvc_voice.py --rvc rvc --untrained-test --config rvc/configs/v1/40k.json --version v1 --id test-untrained --name "TEST (untrained)" --out testmodels/voices/test-untrained
          python tools/ci/make_test_audio.py "Test Song.wav"
          $env:VB_ENGINE_DIR = "$PWD/build-ci/VocalEngine_artefacts/Release"
          $env:VB_MODELS_DIR = "$PWD/testmodels"
          $PSNativeCommandUseErrorActionPreference = $false
          build-ci/PluginWorkflowTest_artefacts/Release/PluginWorkflowTest.exe "Test Song.wav" ui-snapshot.png *> workflow-test.log
          $code = $LASTEXITCODE
          Get-Content workflow-test.log
          if ($code -ne 0) { exit 1 }
          $PSNativeCommandUseErrorActionPreference = $true
          dist/app/VocalEngine.exe info --models dist/models

      - name: pluginval
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process pluginval/pluginval.exe -ArgumentList '--strictness-level','10','--verbose','--output-dir','pluginval-logs','"dist/vst3/Vocal Builder.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-logs -Filter *.txt | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer (Inno Setup)
        run: |
          $version = (Get-Content VERSION -First 1).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DDist=$PWD\dist" installer/VocalBuilder.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VocalBuilder-windows-x64
          path: |
            installer/Output/*.exe
            dist/vst3
            pluginval-logs
            ui-snapshot.png

      - name: Report result to issue #1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $nl = [Environment]::NewLine
          $fence = '```'
          $body = "Run ${{ github.run_id }} (${{ github.event_name }}, ${{ github.sha }}): **${{ job.status }}**" + $nl
          $body += "Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" + $nl
          if (Test-Path build.log) {
            $errs = Select-String -Path build.log -Pattern ' error ' | Select-Object -First 25 | ForEach-Object { $_.Line }
            if ($errs) { $body += $nl + "Build errors:" + $nl + $fence + $nl + ($errs -join $nl) + $nl + $fence + $nl }
          }
          if (Test-Path workflow-test.log) { $body += $nl + "Workflow test:" + $nl + $fence + $nl + ((Get-Content workflow-test.log -Tail 60) -join $nl) + $nl + $fence + $nl }
          Get-ChildItem pluginval-logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { $body += $nl + "pluginval:" + $nl + $fence + $nl + ((Get-Content $_.FullName -Tail 8) -join $nl) + $nl + $fence + $nl }
          Get-ChildItem installer/Output -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { $body += $nl + "Installer: $($_.Name) ($([math]::Round($_.Length/1MB)) MB)" + $nl }
          $body | Out-File -Encoding utf8 report.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file report.md
